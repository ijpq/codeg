name: Isolated Windows UI regression
on:
  push:
    branches: ["main", "fix/execution-scroll-v0.36.0"]
    paths:
      - "src/components/message/**"
      - "src/components/ai-elements/message-thread*"
      - "tests/browser/**"
      - "scripts/verify-windows-ui.mjs"
      - "scripts/browser-scroll-regression.mjs"
      - ".github/workflows/windows-ui-regression.yml"
  workflow_dispatch:
    inputs:
      candidate:
        description: Build current Windows packages and verify native Goal UI before tagging
        type: boolean
        default: false
      reuse_candidate:
        description: Diagnose verification scripts using the pinned 29df14a0c candidate binaries
        type: boolean
        default: false
      diagnose_allocation:
        description: Isolate the published fix3 Server allocation crash; never a release acceptance result
        type: boolean
        default: false
      diagnose_fix2:
        description: Verify the corrected harness against the unchanged unpublished b9c6baeae Windows packages
        type: boolean
        default: false
env:
  CARGO_BUILD_JOBS: 1
  RUST_BACKTRACE: short
  CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: "-C target-feature=+crt-static"
  HUSKY: 0
jobs:
  profile-paths:
    if: ${{ !inputs.diagnose_allocation }}
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify isolated profiles with the Windows Known Folder API
        run: node --test scripts/test-windows-ui-profile.mjs
  setup-ui:
    if: ${{ !inputs.diagnose_fix2 && !inputs.diagnose_allocation }}
    runs-on: windows-2022
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pnpm install --frozen-lockfile
      - name: Verify payload, dependency and database handle regressions
        run: python -B scripts/test-verify-setup-binaries.py
      - name: Restore pinned diagnostic candidate without rebuilding application code
        if: inputs.candidate && inputs.reuse_candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import hashlib, json, os, subprocess, zipfile
          from pathlib import Path
          repo = os.environ['GITHUB_REPOSITORY']
          run_id, artifact_id = 40162274216, 12589902658
          source = '29df14a0cf0991f0f873ffe20abcb486f453a2a3'
          digest = 'fbc1672513d3c9105f73ead628dcf24adf987782c450c840d23f46693b77b5c1'
          def api(path):
              return json.loads(subprocess.check_output(['gh', 'api', f'repos/{repo}/{path}']))
          run = api(f'actions/runs/{run_id}')
          artifact = api(f'actions/artifacts/{artifact_id}')
          assert run['head_sha'] == source and run['path'] == '.github/workflows/windows-ui-regression.yml'
          assert artifact['workflow_run']['id'] == run_id and artifact['workflow_run']['head_sha'] == source
          assert artifact['name'] == 'candidate-windows-binaries' and artifact['digest'] == 'sha256:' + digest
          # Reuse only while application code exactly matches this built source;
          # this path diagnoses verification changes, never release binaries.
          subprocess.run(['git', 'diff', '--exit-code', source, 'HEAD', '--',
                          'src', 'src-tauri', 'i18n', 'public', 'package.json', 'pnpm-lock.yaml', 'next.config.ts'], check=True)
          jobs = api(f'actions/runs/{run_id}/jobs')
          assert any(step['name'] == 'Build isolated candidate Setup and Server' and step['conclusion'] == 'success'
                     for job in jobs['jobs'] for step in job['steps'])
          archive = Path(os.environ['RUNNER_TEMP']) / 'diagnostic-candidate.zip'
          with archive.open('wb') as stream:
              subprocess.run(['gh', 'api', f'repos/{repo}/actions/artifacts/{artifact_id}/zip'], stdout=stream, check=True)
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == digest
          root = Path.cwd().resolve()
          with zipfile.ZipFile(archive) as bundle:
              assert all((root / name).resolve().is_relative_to(root) for name in bundle.namelist())
              bundle.extractall(root)
          assert json.loads((root / 'out/codeg-release-manifest.json').read_text())['commit'] == source
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('CODEG_CANDIDATE_SHA=' + source + '\n')
          print('Testing the checksum-pinned diagnostic application commit', source)
          PY
      - uses: dtolnay/rust-toolchain@stable
        if: inputs.candidate && !inputs.reuse_candidate
        with:
          targets: x86_64-pc-windows-msvc
      - uses: swatinem/rust-cache@v2
        if: inputs.candidate && !inputs.reuse_candidate
        with:
          workspaces: "./src-tauri -> target"
          shared-key: x86_64-pc-windows-msvc
          cache-on-failure: true
      - name: Build isolated candidate Setup and Server
        if: inputs.candidate && !inputs.reuse_candidate
        shell: pwsh
        run: |
          pnpm tauri:prepare-sidecars --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { throw 'Candidate sidecar build failed' }
          $env:CODEG_SKIP_SIDECAR='1'
          $config=Join-Path $env:RUNNER_TEMP 'candidate-tauri-config.json'
          '{"bundle":{"createUpdaterArtifacts":false}}' | Set-Content $config
          pnpm tauri build --target x86_64-pc-windows-msvc --bundles nsis --config $config
          if ($LASTEXITCODE -ne 0) { throw 'Candidate Setup build failed' }
          cargo build --manifest-path src-tauri/Cargo.toml --release --no-default-features --features server-bin --bin codeg-server --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { throw 'Candidate Server build failed' }
      - name: Retain candidate binaries for diagnosis without rebuilding
        if: inputs.candidate && !inputs.reuse_candidate
        uses: actions/upload-artifact@v4
        with:
          name: candidate-windows-binaries
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            src-tauri/target/x86_64-pc-windows-msvc/release/codeg-server.exe
            src-tauri/target/x86_64-pc-windows-msvc/release/codeg-mcp.exe
            src-tauri/target/x86_64-pc-windows-msvc/release/codeg-computer-helper.exe
            src-tauri/target/x86_64-pc-windows-msvc/release/codeg-cli.exe
            out/
            dist/pi-runtime/
          if-no-files-found: error
          retention-days: 7
      - name: Download verified published baseline into the runner
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_UI: ${{ inputs.candidate }}
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:RUNNER_TEMP 'ui-baseline'
          New-Item -ItemType Directory -Force $root | Out-Null
          gh release download v0.36.0-fix1 --repo $env:GITHUB_REPOSITORY --dir $root
          if ($LASTEXITCODE -ne 0) { throw 'Baseline download failed' }
          foreach ($file in @('codeg_0.36.0-fix1_x64-setup.exe','codeg-server-windows-x64.zip')) {
            $hash=((Get-Content (Join-Path $root "$file.sha256") -Raw).Trim() -split '\s+')[0].ToLower()
            if ((Get-FileHash (Join-Path $root $file) -Algorithm SHA256).Hash.ToLower() -ne $hash) { throw 'Baseline hash mismatch' }
          }
          Expand-Archive (Join-Path $root 'codeg-server-windows-x64.zip') (Join-Path $root 'server')
          $setup=Join-Path $root 'codeg_0.36.0-fix1_x64-setup.exe'
          $previous=$setup
          $server=Join-Path $root 'server/codeg-server-windows-x64'
          $extra=@('--baseline','true')
          $version='0.36.0-fix1'
          if ($env:CANDIDATE_UI -eq 'true') {
            $version=(Get-Content package.json -Raw | ConvertFrom-Json).version
            $setup=(Get-Item "src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/codeg_${version}_x64-setup.exe").FullName
            $candidate=Join-Path $env:RUNNER_TEMP 'candidate-server'
            New-Item -ItemType Directory -Force $candidate | Out-Null
            Copy-Item -Recurse out (Join-Path $candidate 'web')
            Copy-Item -Recurse (Join-Path $server 'runtime') (Join-Path $candidate 'runtime')
            Copy-Item -Recurse dist/pi-runtime (Join-Path $candidate 'pi-runtime')
            foreach ($binary in @('codeg-server','codeg-mcp','codeg-computer-helper','codeg-cli')) {
              Copy-Item "src-tauri/target/x86_64-pc-windows-msvc/release/$binary.exe" $candidate
            }
            # The unchanged private CLI is a test input from the checksum-verified
            # baseline, never substituted for a candidate CodeG/MCP executable.
            $originalSha=$env:GITHUB_SHA
            try {
              if ($env:CODEG_CANDIDATE_SHA) { $env:GITHUB_SHA=$env:CODEG_CANDIDATE_SHA }
              python -B scripts/smoke-server-package.py $candidate $version --require-runtime --log-dir (Join-Path $env:RUNNER_TEMP 'ui-evidence/candidate-smoke')
            } finally { $env:GITHUB_SHA=$originalSha }
            if ($LASTEXITCODE -ne 0) { throw 'Candidate package resources/dependencies failed' }
            $tools=Join-Path $env:RUNNER_TEMP 'candidate-native-tools'
            npm install --prefix $tools --global --include=optional --ignore-scripts --no-audit --no-fund '@agentclientprotocol/codex-acp@2.2.2' '@agentclientprotocol/claude-agent-acp@0.94.0'
            if ($LASTEXITCODE -ne 0) { throw 'Isolated native ACP installation failed' }
            python -B scripts/prepare-office-preview-test.py --output $tools
            if ($LASTEXITCODE -ne 0) { throw 'Isolated Office converter verification failed' }
            $server=$candidate
            $extra=@('--native-tools',$tools)
          }
          node scripts/verify-windows-ui.mjs --setup $setup --previous $previous --server $server --output (Join-Path $env:RUNNER_TEMP 'ui-evidence') --version $version @extra
          if ($LASTEXITCODE -ne 0) { throw 'Isolated UI verification failed' }
          if ($env:CANDIDATE_UI -eq 'true') {
            python -B scripts/verify-windows-dependencies.py (Join-Path $env:RUNNER_TEMP 'ui-evidence/upgraded-installation') --report (Join-Path $env:RUNNER_TEMP 'ui-evidence/setup-windows-dependencies.json')
            if ($LASTEXITCODE -ne 0) { throw 'Candidate Setup runtime dependencies failed' }
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-ui-evidence
          path: |
            ${{ runner.temp }}/ui-evidence/**/*.json
            ${{ runner.temp }}/ui-evidence/**/*.log
            ${{ runner.temp }}/ui-evidence/**/*.png
          retention-days: 14
  diagnose-fix2:
    if: inputs.diagnose_fix2
    needs: profile-paths
    runs-on: windows-2022
    permissions:
      actions: read
      # GitHub requires push access to read an unpublished draft's assets.
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pnpm install --frozen-lockfile
      - name: Verify the current harness with source-pinned diagnostic packages
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $source='b9c6baeae78498112ddd28a6ece7804e9cfac29e'
          git diff --exit-code $source HEAD -- src src-tauri/src public vendor pnpm-lock.yaml next.config.ts
          if ($LASTEXITCODE -ne 0) { throw 'Diagnostic application source differs from the pinned packages' }
          $run=gh api repos/$env:GITHUB_REPOSITORY/actions/runs/40399440112 | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $run.head_sha -ne $source) { throw 'Diagnostic package workflow source mismatch' }
          gh run download 40399440112 --repo $env:GITHUB_REPOSITORY --name release-windows-setup-evidence --dir setup-evidence
          if ($LASTEXITCODE -ne 0) { throw 'Pinned Setup manifest download failed' }
          $env:CODEG_VERIFIER_SHA=$env:GITHUB_SHA
          $env:GITHUB_SHA=$source
          ./scripts/verify-windows-release.ps1 -ReleaseTag v0.40.0-fix2 -Repository $env:GITHUB_REPOSITORY -Destination "$env:RUNNER_TEMP/fix2-verifier-diagnosis" -SetupManifest setup-evidence/payload.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diagnostic-fix2-verifier-evidence
          path: |
            ${{ runner.temp }}/fix2-verifier-diagnosis/**/verification.json
            ${{ runner.temp }}/fix2-verifier-diagnosis/**/*.log
            ${{ runner.temp }}/fix2-verifier-diagnosis/**/*.png
            ${{ runner.temp }}/fix2-verifier-diagnosis/**/scroll-results.json
            ${{ runner.temp }}/fix2-verifier-diagnosis/**/*-failure.json
            ${{ runner.temp }}/fix2-verifier-diagnosis/**/resources-and-migrations.json
            ${{ runner.temp }}/fix2-verifier-diagnosis/**/*dependencies.json
          retention-days: 14
  diagnose-allocation:
    if: inputs.diagnose_allocation
    permissions:
      contents: write
      actions: read
    env:
      RUST_BACKTRACE: full
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      PYTHONUTF8: "1"
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          shared-key: test-windows-latest-server
          cache-on-failure: true
      - name: Pin and quarantine the failed release; download diagnostic assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          git diff --exit-code 81836e25d1d21d6627eb8062441c2505d4eaf3ea HEAD -- src src-tauri i18n public package.json pnpm-lock.yaml
          if ($LASTEXITCODE -ne 0) { throw 'Diagnostic must keep product source unchanged' }
          $root=Join-Path $env:RUNNER_TEMP 'allocation-diagnosis'
          New-Item -ItemType Directory $root | Out-Null
          $release=gh api repos/$env:GITHUB_REPOSITORY/releases/tags/v0.40.0-fix3 | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $release.tag_name -ne 'v0.40.0-fix3') { throw 'Wrong diagnostic release' }
          gh api --method PATCH repos/$env:GITHUB_REPOSITORY/releases/$($release.id) -F prerelease=true -f make_latest=false | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Failed to quarantine unverified release' }
          gh release download v0.40.0-fix3 --repo $env:GITHUB_REPOSITORY --dir $root --pattern codeg-server-windows-x64.zip
          if ($LASTEXITCODE -ne 0) { throw 'Diagnostic package download failed' }
          $archive=Join-Path $root 'codeg-server-windows-x64.zip'
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLower() -ne 'd55a7b1b4b921f13a1f8d435274ddbc1ebfc14c15f34bd9a2c4c24abb15dc485') { throw 'Diagnostic asset hash mismatch' }
          Expand-Archive $archive (Join-Path $root 'expanded')
          $server=Join-Path $root 'expanded/codeg-server-windows-x64'
          $manifest=Get-Content (Join-Path $server 'web/codeg-release-manifest.json') -Raw | ConvertFrom-Json
          if ($manifest.commit -ne '81836e25d1d21d6627eb8062441c2505d4eaf3ea') { throw 'Diagnostic source mismatch' }
          Copy-Item (Join-Path $server 'web') out -Recurse
          "DIAG_ROOT=$root" >> $env:GITHUB_ENV
          "DIAG_SERVER=$server" >> $env:GITHUB_ENV
      - run: pnpm install --frozen-lockfile
      - name: Prepare isolated protocol and browser harness
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tools=Join-Path $env:DIAG_ROOT 'native-agent-tools'
          npm install --prefix $tools --global --include=optional --ignore-scripts --no-audit --no-fund '@agentclientprotocol/codex-acp@2.2.2' '@agentclientprotocol/claude-agent-acp@0.94.0'
          if ($LASTEXITCODE -ne 0) { throw 'Isolated adapter install failed' }
          python -B scripts/prepare-office-preview-test.py --output $tools
          if ($LASTEXITCODE -ne 0) { throw 'Office test converter failed' }
          @'
          from pathlib import Path
          p = Path('scripts/verify-windows-ui.mjs')
          s = p.read_text(encoding="utf-8")
          start = s.index('  const f = await fixture("setup-upgrade")')
          end = s.index('  const s = await fixture("server-web")', start)
          p.write_text(s[:start] + s[end:], encoding="utf-8")
          '@ | python -B -
          if ($LASTEXITCODE -ne 0) { throw 'Server-only diagnostic harness preparation failed' }
      - name: Exercise original published Server before instrumentation
        shell: pwsh
        run: |
          node scripts/verify-windows-ui.mjs --server $env:DIAG_SERVER --output (Join-Path $env:DIAG_ROOT 'original-server') --version 0.40.0-fix3 --native-tools (Join-Path $env:DIAG_ROOT 'native-agent-tools')
          $result=$LASTEXITCODE
          @{ diagnostic=$true; instrumented=$false; exit_code=$result } | ConvertTo-Json | Set-Content (Join-Path $env:DIAG_ROOT 'original-result.json')
          exit 0
      - name: Build a diagnostic binary with symbolized bounded allocation tracing
        shell: pwsh
        run: |
          Get-Content scripts/diagnostic-allocation-trace.rs -Raw | Add-Content src-tauri/src/bin/codeg_server.rs
          cargo build --manifest-path src-tauri/Cargo.toml --no-default-features --features server-bin --bin codeg-server
          if ($LASTEXITCODE -ne 0) { throw 'Diagnostic build failed' }
          Copy-Item src-tauri/target/debug/codeg-server.exe $env:DIAG_SERVER -Force
          Copy-Item src-tauri/target/debug/codeg_server.pdb $env:DIAG_SERVER -ErrorAction SilentlyContinue
          Copy-Item src-tauri/target/debug/codeg-server.pdb $env:DIAG_SERVER -ErrorAction SilentlyContinue
      - name: Reproduce with allocation call stacks and fresh isolated profiles
        shell: pwsh
        run: |
          foreach ($i in 1..3) {
            node scripts/verify-windows-ui.mjs --server $env:DIAG_SERVER --output (Join-Path $env:DIAG_ROOT "traced-server-$i") --version 0.40.0-fix3 --native-tools (Join-Path $env:DIAG_ROOT 'native-agent-tools')
            $result=$LASTEXITCODE
            @{ diagnostic=$true; instrumented=$true; exit_code=$result } | ConvertTo-Json | Set-Content (Join-Path $env:DIAG_ROOT "traced-result-$i.json")
            if ($result -ne 0) { break }
          }
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: server-allocation-diagnostics
          path: |
            ${{ runner.temp }}/allocation-diagnosis/**/*result*.json
            ${{ runner.temp }}/allocation-diagnosis/**/verification.json
            ${{ runner.temp }}/allocation-diagnosis/**/*.log
            ${{ runner.temp }}/allocation-diagnosis/**/*-failure.json
          retention-days: 14
