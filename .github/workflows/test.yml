name: Test

on:
  push:
    branches:
      - main
  pull_request:

env:
  RUST_BACKTRACE: short
  # Refuse to silently regenerate snapshots in CI — any drift must be
  # accepted locally with `cargo insta review` and committed.
  INSTA_UPDATE: "no"

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (lint + vitest + build)
    # Frontend tests are OS-independent (jsdom + pure TS), keep on Linux
    # to save CI minutes.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint .

      - name: Browser agent bundle matches its source
        # `src-tauri/src/browser/js/agent.bundle.js` is committed so that a
        # cargo build needs no node — `include_str!` reads it at compile time.
        # A committed artifact is only worth anything if it is the one the
        # source produces, and nothing else in the build would notice a stale
        # one: the Rust side would happily embed last week's bundle.
        run: pnpm browser:agent:check

      - name: Browser agent typecheck
        # `browser-agent/` is excluded from the app's tsconfig (its vendored
        # half answers to Playwright's compiler settings, not ours), so the
        # repo-wide typecheck in `pnpm build` never sees our entry point.
        run: pnpm browser:agent:types

      - name: Unit tests (vitest)
        run: pnpm test

      - name: Published Codex ACP terminal and AIR regression
        run: node --test scripts/test-codex-air-terminal.mjs

      - name: Cross-platform resume context comparison regression
        run: python3 -B scripts/test-codex-resume-comparison.py

      - name: NSIS payload verification regression
        run: python3 -B scripts/test-verify-setup-binaries.py

      - name: Draft release reuse regression
        run: node --test scripts/test-release-draft.mjs

      - name: Static export build
        run: pnpm build

  rust:
    name: Rust ${{ matrix.mode }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
        mode: [desktop, server]
        include:
          - mode: desktop
            # `test-utils` exposes test scaffolding (AppState::new_for_test,
            # EventEmitter::test_web_only, ConnectionManager::insert_test_connection,
            # parser `with_base_dir`, `db::test_helpers`) for integration tests
            # under `tests/`. Without the flag those items are physically
            # uncompiled, so integration tests would fail to link.
            cargo_args: "--features test-utils"
            # Desktop clippy must lint integration tests too, so it picks up
            # `--all-targets`. test-utils is already on, so tests compile.
            clippy_args: "--all-targets --features test-utils"
          - mode: server
            # Server build is feature-gated off the Tauri runtime; no
            # need for webkit/appindicator system libs. `--lib` skips
            # integration tests for `cargo test`, so `test-utils` is not
            # required here.
            cargo_args: "--no-default-features --features server-bin --bin codeg-server --lib"
            # Server clippy intentionally skips `--all-targets`: integration
            # tests are already linted in the desktop cells, and pulling
            # them in here would force `test-utils` (a test-only feature)
            # into the server build matrix. Lint scope here is lib + the
            # codeg-server binary, which is exactly the cfg-gated surface
            # that this cell exists to verify.
            clippy_args: "--no-default-features --features server-bin --bin codeg-server --lib"
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # The standard ARM macOS runner has 7 GB RAM. The workspace library
      # and its test binary otherwise compile at the same time, each using
      # several GB. Keep the exact test/clippy scope while reducing compiler
      # concurrency and debug-info generation; test threads are unchanged.
      - name: Fit macOS Rust compilation within runner memory
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          {
            echo "CARGO_BUILD_JOBS=1"
            echo "CARGO_PROFILE_DEV_DEBUG=0"
            echo "CARGO_PROFILE_TEST_DEBUG=0"
          } >> "$GITHUB_ENV"

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          shared-key: test-${{ matrix.os }}-${{ matrix.mode }}

      - name: Install Linux desktop dependencies
        # Only the Linux desktop build needs webkit/appindicator. Windows
        # ships WebView2 with the OS; macOS uses WKWebView from the SDK.
        if: matrix.os == 'ubuntu-22.04' && matrix.mode == 'desktop'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Prepare Tauri frontendDist placeholder
        # Tauri's build script validates `frontendDist` and bundled resource
        # paths during Rust compilation. The frontend job owns the real static
        # export; Rust desktop cells only need the path to exist for tests.
        if: matrix.mode == 'desktop'
        shell: bash
        run: |
          mkdir -p out
          printf '<!doctype html><html><body></body></html>\n' > out/index.html

      - name: cargo test
        # Windows desktop test binaries link the Tauri runtime and can fail at
        # process load on GitHub-hosted runners before Rust tests start. Keep
        # compile coverage here; Linux/macOS desktop and Windows server cells
        # run the executable test suites.
        working-directory: src-tauri
        run: cargo test ${{ matrix.cargo_args }} ${{ (matrix.os == 'windows-latest' && matrix.mode == 'desktop') && '--no-run' || '' }}

      - name: cargo clippy
        # Clippy on each (os, mode) cell — desktop covers tauri-only code
        # paths plus integration tests, server covers cfg-gated server-only
        # code. Treat warnings as errors now that the 8 pre-existing
        # advisories are cleared.
        working-directory: src-tauri
        run: cargo clippy ${{ matrix.clippy_args }} -- -D warnings

      - name: Web handlers must route through commands/*_core
        # Lock in the dedup from Phase 8: web/handlers/{folders,conversations}.rs
        # must not call DB services directly. They have to delegate to a
        # `_core` function in `commands/*.rs` so the Tauri command and HTTP
        # entrypoints share one implementation. Run on Linux only — pure
        # text check, no per-OS variance.
        if: matrix.os == 'ubuntu-22.04' && matrix.mode == 'desktop'
        working-directory: src-tauri
        run: |
          if grep -nE 'folder_service::|conversation_service::|tab_service::|import_service::' \
             src/web/handlers/folders.rs \
             src/web/handlers/conversations.rs; then
            echo "::error::Web handlers must call commands/*_core, not services directly."
            exit 1
          fi

  codex-recovery:
    name: Codex recovery on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: clippy
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install native build prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libssl-dev libcap-dev pkg-config cmake clang strace
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install isolated reference CLI
        run: npm install --prefix "$RUNNER_TEMP/codeg-codex-reference" --ignore-scripts --no-audit --no-fund @openai/codex@0.162.1
      - name: Prepare exact pinned runtime source
        run: python -B scripts/build-codex-runtime.py --source-dir "$RUNNER_TEMP/codeg-codex-source" --output-dir "$RUNNER_TEMP/codeg-codex-runtime" --prepare-only
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "${{ runner.temp }}/codeg-codex-source/codex-rs -> ../../codeg-codex-target"
          shared-key: codex-recovery-${{ matrix.os }}
          cache-on-failure: true
      - name: Test and build pinned recovery runtime
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/codeg-codex-target
        run: python -B scripts/build-codex-runtime.py --source-dir "$RUNNER_TEMP/codeg-codex-source" --output-dir "$RUNNER_TEMP/codeg-codex-runtime"
      - name: Verify model context, tools, images, restart and invalidation
        run: |
          python - <<'PY'
          import os, subprocess, sys
          from pathlib import Path
          scratch=Path(os.environ['RUNNER_TEMP'])
          suffix='.exe' if os.name=='nt' else ''
          references=[p for p in (scratch/'codeg-codex-reference/node_modules/@openai').rglob('codex'+suffix) if p.is_file()]
          if len(references)!=1:
            raise RuntimeError(f'Expected one installed reference CLI, found {references}')
          reference=references[0]
          if subprocess.check_output([str(reference),'--version'],text=True).strip()!='codex-cli 0.162.1':
            raise RuntimeError('Reference CLI version does not match the pin')
          subprocess.run([sys.executable,'-B','scripts/test-codex-resume.py',
            '--cli',str(scratch/'codeg-codex-runtime'/('codex'+suffix)),
            '--baseline-cli',str(reference),'--output',str(scratch/'codeg-codex-evidence'),
            '--size-mib','64','--trace'],check=True)
          PY
      - name: Verify one full read for old checkpoint fallback
        if: runner.os == 'Linux'
        run: python3 -B scripts/test-codex-resume.py --cli "$RUNNER_TEMP/codeg-codex-runtime/codex" --output "$RUNNER_TEMP/codeg-codex-evidence/legacy" --size-mib 64 --checkpoint-mode legacy --trace
      - name: Verify current and newer ACP adapters on the pinned runtime
        if: runner.os == 'Linux'
        run: |
          npm install --prefix "$RUNNER_TEMP/codeg-acp-211" --ignore-scripts --no-audit --no-fund @agentclientprotocol/codex-acp@2.1.1
          npm install --prefix "$RUNNER_TEMP/codeg-acp-222" --ignore-scripts --no-audit --no-fund @agentclientprotocol/codex-acp@2.2.2
          python3 -B scripts/diagnose-codex-resume-layers.py --cli "$RUNNER_TEMP/codeg-codex-runtime/codex" --acp "$RUNNER_TEMP/codeg-acp-211/node_modules/.bin/codex-acp" --output "$RUNNER_TEMP/codeg-codex-evidence/acp-211" --size-mib 64 --fast --verify-prompt
          python3 -B scripts/diagnose-codex-resume-layers.py --cli "$RUNNER_TEMP/codeg-codex-runtime/codex" --acp "$RUNNER_TEMP/codeg-acp-222/node_modules/.bin/codex-acp" --output "$RUNNER_TEMP/codeg-codex-evidence/acp-222" --size-mib 64 --fast --verify-prompt
      - name: Retain recovery diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codex-recovery-evidence-${{ runner.os }}
          path: ${{ runner.temp }}/codeg-codex-evidence
          if-no-files-found: warn
