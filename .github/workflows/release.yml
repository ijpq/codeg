name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag whose server assets should be rebuilt"
        required: true
        type: string

env:
  RUST_BACKTRACE: short
  CARGO_BUILD_JOBS: 1
  HUSKY: 0
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  create-draft-release:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.release.outputs.release_id }}
      release_url: ${{ steps.release.outputs.release_url }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      release_body: ${{ steps.release.outputs.release_body }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}

      - id: meta
        name: Resolve release channel
        shell: bash
        run: |
          if [[ "${RELEASE_TAG}" == *"-rc"* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check tag commit belongs to default branch
        shell: bash
        run: |
          DEFAULT_BRANCH="${{ github.event.repository.default_branch }}"
          git fetch origin "${DEFAULT_BRANCH}"
          git fetch --force origin \
            "+refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"

          TAG_COMMIT=$(git rev-list -n 1 "${RELEASE_TAG}")
          if git merge-base --is-ancestor "${TAG_COMMIT}" "origin/${DEFAULT_BRANCH}"; then
            echo "Tag ${RELEASE_TAG} is based on ${DEFAULT_BRANCH}"
          else
            echo "Tag ${RELEASE_TAG} is not based on ${DEFAULT_BRANCH}"
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify tag matches app version
        shell: bash
        run: |
          APP_VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [[ "v$APP_VERSION" != "${RELEASE_TAG}" ]]; then
            echo "Tag ${RELEASE_TAG} does not match app version v$APP_VERSION"
            exit 1
          fi

      - id: release
        name: Create or reuse draft release
        uses: actions/github-script@v7
        env:
          PRERELEASE: ${{ steps.meta.outputs.prerelease }}
          SERVER_ONLY: ${{ github.event_name == 'workflow_dispatch' }}
        with:
          script: |
            const fs = require("fs");
            const tag = process.env.RELEASE_TAG;
            const { owner, repo } = context.repo;
            const prerelease = process.env.PRERELEASE === "true";
            const serverOnly = process.env.SERVER_ONLY === "true";
            const releaseName = `codeg ${tag}`;
            const { data: tagRef } = await github.rest.git.getRef({
              owner,
              repo,
              ref: `tags/${tag}`,
            });

            let commitSha = tagRef.object.sha;
            if (tagRef.object.type === "tag") {
              const { data: annotatedTag } = await github.rest.git.getTag({
                owner,
                repo,
                tag_sha: commitSha,
              });
              if (annotatedTag.object.type !== "commit") {
                core.setFailed(
                  `Tag ${tag} points to ${annotatedTag.object.type}, not a commit.`,
                );
                return;
              }
              commitSha = annotatedTag.object.sha;
            }

            const { data: commit } = await github.rest.repos.getCommit({
              owner,
              repo,
              ref: commitSha,
            });

            const releaseNotesPath = `docs/releases/${tag}.md`;
            let releaseBody = fs.existsSync(releaseNotesPath)
              ? fs.readFileSync(releaseNotesPath, "utf8").trim()
              : commit.commit.message?.trim() || "_No commit message._";
            if (context.payload.repository?.fork) {
              releaseBody +=
                "\n\n> [!WARNING]\n" +
                "> This fork release is built without the upstream signing and " +
                "notarization credentials. Desktop installers and server archives " +
                "are unsigned; server archives include SHA-256 checksums. Use " +
                "manual installation instead of the signed automatic updater.";
            }
            let release;

            // REST tag lookup only returns published releases. A token with
            // push access can list drafts, including ones from a prior attempt.
            const releases = await github.paginate(
              github.rest.repos.listReleases,
              { owner, repo, per_page: 100 },
            );
            const existing = releases.find(
              (candidate) => candidate.tag_name === tag,
            );
            if (existing) {
              release = existing;
              if (!release.draft) {
                if (!serverOnly) {
                  core.setFailed(
                    `Release for tag ${tag} already exists and is not a draft.`,
                  );
                  return;
                }
                core.info(
                  `Reusing published release #${release.id} for server asset repair`,
                );
              } else {
                if (
                  release.prerelease !== prerelease ||
                  release.name !== releaseName ||
                  (release.body ?? "").trim() !== releaseBody
                ) {
                  const updated = await github.rest.repos.updateRelease({
                    owner,
                    repo,
                    release_id: release.id,
                    name: releaseName,
                    prerelease,
                    body: releaseBody,
                  });
                  release = updated.data;
                }
                core.info(`Reusing existing draft release #${release.id}`);
              }
            } else {
              if (serverOnly) {
                core.setFailed(
                  `Release for tag ${tag} does not exist; server-only mode only repairs an existing release.`,
                );
                return;
              }

              const created = await github.rest.repos.createRelease({
                owner,
                repo,
                tag_name: tag,
                name: releaseName,
                body: releaseBody,
                draft: true,
                prerelease,
              });

              release = created.data;
              core.info(`Created draft release #${release.id}`);
            }

            core.setOutput("release_id", String(release.id));
            core.setOutput("release_url", release.html_url);
            core.setOutput("release_body", release.body ?? releaseBody);

  build-tauri:
    needs: create-draft-release
    env:
      # Apply to the application and both prepared sidecars.
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: "-C target-feature=+crt-static"
    # v0.30.7-fix1 is the server-only maintenance release requested by the
    # operator. Keep the normal desktop matrix for later tags.
    if: github.event_name == 'push' && github.ref_name != 'v0.30.7-fix1'
    name: Build ${{ matrix.name }}
    permissions:
      contents: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "Windows x64"
            runner: "windows-2022"
            target: "x86_64-pc-windows-msvc"
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          shared-key: ${{ matrix.target }}

      - name: Install Linux x64 dependencies
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install Linux arm64 cross dependencies
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          cat > /tmp/sources.list << 'EOF'
          deb [arch=amd64] http://archive.ubuntu.com/ubuntu jammy main restricted universe multiverse
          deb [arch=amd64] http://archive.ubuntu.com/ubuntu jammy-updates main restricted universe multiverse
          deb [arch=amd64] http://archive.ubuntu.com/ubuntu jammy-backports main restricted universe multiverse
          deb [arch=amd64] http://security.ubuntu.com/ubuntu jammy-security main restricted universe multiverse

          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy main restricted universe multiverse
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy-updates main restricted universe multiverse
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy-backports main restricted universe multiverse
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy-security main restricted universe multiverse
          EOF
          sudo mv /etc/apt/sources.list /etc/apt/sources.list.default
          sudo mv /tmp/sources.list /etc/apt/sources.list

          sudo dpkg --add-architecture arm64
          sudo apt-get update
          # libgraphite2-3 / libharfbuzz0b / libfreetype6 / libssl3 are
          # Multi-Arch: same — their :arm64 and :amd64 copies must be the
          # EXACT same version. The runner ships stale :amd64 copies, and a
          # jammy security bump (e.g. graphite2 1.3.14-1ubuntu0.1) made the
          # :arm64 webkit dev chain demand a newer version than the preinstalled
          # :amd64. apt then refuses the :arm64 copy ("not going to be
          # installed" / held broken packages). Upgrading the preinstalled
          # :amd64 copies first lets both arches land on the same version.
          # --only-upgrade never installs new packages, so any lib that is
          # absent is simply skipped.
          sudo apt-get install -y --only-upgrade \
            libgraphite2-3 \
            libharfbuzz0b \
            libfreetype6 \
            libssl3
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            libwebkit2gtk-4.1-dev:arm64 \
            libayatana-appindicator3-dev:arm64 \
            librsvg2-dev:arm64 \
            libssl-dev:arm64 \
            patchelf

      - name: Configure Linux arm64 cross env
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        shell: bash
        run: |
          echo "PKG_CONFIG_ALLOW_CROSS=1" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=/usr/lib/aarch64-linux-gnu/pkgconfig:/usr/share/pkgconfig" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_LIBDIR=/usr/lib/aarch64-linux-gnu/pkgconfig:/usr/share/pkgconfig" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_SYSROOT_DIR=/usr/aarch64-linux-gnu" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_AR=aarch64-linux-gnu-gcc-ar" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_RUSTFLAGS=-Clinker=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
          echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
          echo "CXX_aarch64_unknown_linux_gnu=aarch64-linux-gnu-g++" >> "$GITHUB_ENV"
          echo "AR_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc-ar" >> "$GITHUB_ENV"

      - name: Verify Linux arm64 cross toolchain
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        shell: bash
        run: |
          which aarch64-linux-gnu-gcc
          aarch64-linux-gnu-gcc -v
          rustup target list --installed
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=${CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER}"
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_AR=${CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_AR}"
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_RUSTFLAGS=${CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_RUSTFLAGS}"

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # Computer use on macOS: codeg and codeg-computer-helper each check the
      # other's code signature at run time, against a designated requirement
      # compiled into the binary (never read from the bundle, which the user
      # can write to), and codeg launches the helper under a launch
      # requirement naming this Team ID, so the kernel runs nothing else from
      # the helper's path. All of it names this release's Team ID, so it is
      # pinned here, before anything is compiled, for every later step: the
      # helper is built by prepare-sidecars (it checks codeg), codeg by
      # tauri-action (it checks and launches the helper). A helper built
      # without its requirement refuses to start once it is Developer-ID
      # signed, and codeg will not build with one pin and not the other.
      - name: Pin computer-use trust anchors (macOS)
        if: contains(matrix.target, 'apple-darwin')
        shell: bash
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "${APPLE_TEAM_ID}" ]; then
            echo "FATAL: APPLE_TEAM_ID is required to pin the computer-use trust anchors"
            exit 1
          fi
          anchor="anchor apple generic and certificate 1[field.1.2.840.113635.100.6.2.6] /* exists */ and certificate leaf[field.1.2.840.113635.100.6.1.13] /* exists */ and certificate leaf[subject.OU] = \"${APPLE_TEAM_ID}\""
          echo "CODEG_COMPUTER_PEER_REQUIREMENT=identifier \"app.codeg\" and ${anchor}" >> "$GITHUB_ENV"
          echo "CODEG_COMPUTER_HELPER_REQUIREMENT=identifier \"app.codeg.computer-helper\" and ${anchor}" >> "$GITHUB_ENV"
          echo "CODEG_COMPUTER_TEAM_ID=${APPLE_TEAM_ID}" >> "$GITHUB_ENV"

      # Build the sidecars — the `codeg-mcp` companion and the
      # `codeg-computer-helper` computer-use executor — for the matrix target
      # and stage them at `src-tauri/binaries/<bin>-<triple>{.exe}`.
      # `tauri-action` (below) then bundles them via the `bundle.externalBin`
      # entries in `tauri.conf.json` — Tauri installs them next to the main
      # executable (install root on Linux/Windows) where the runtime finds
      # them via `current_exe` sibling lookup. On macOS the helper is no
      # sidecar: it is staged as `src-tauri/binaries/codeg-computer-helper.app`
      # and bundled as `Contents/Helpers/codeg-computer-helper.app`
      # (`tauri.macos.conf.json`), since macOS charges an executable's
      # permissions to the app bundle it sits in — a helper in Contents/MacOS
      # would hold codeg's. The Linux arm64 cross env vars set above also
      # apply to this cargo invocation.
      - name: Stage sidecars for Tauri bundle
        shell: bash
        run: |
          pnpm pi:prepare-runtime
          pnpm tauri:prepare-sidecars --target ${{ matrix.target }}

      - name: Stage the exact tested private Codex group for Windows Setup
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -B scripts/fetch-tested-codex-runtime.py --output-dir dist/codex-runtime
          if ($LASTEXITCODE -ne 0) { throw 'Setup tested Codex runtime provenance failed' }
          python -B scripts/build-codex-adapter.py --output-dir dist/codex-runtime
          if ($LASTEXITCODE -ne 0) { throw 'Setup private Codex ACP staging failed' }

      - name: Verify sidecars landed
        shell: bash
        run: |
          ext=""
          case "${{ matrix.target }}" in
            *windows*) ext=".exe" ;;
          esac
          for bin in codeg-mcp codeg-computer-helper codeg-cli; do
            file="src-tauri/binaries/${bin}-${{ matrix.target }}${ext}"
            if [ ! -s "$file" ]; then
              echo "FATAL: sidecar $file missing or empty after prepare-sidecars"
              exit 1
            fi
            ls -la "$file"
          done
          case "${{ matrix.target }}" in
            *apple-darwin*)
              helper="src-tauri/binaries/codeg-computer-helper.app/Contents/MacOS/codeg-computer-helper"
              if [ ! -s "$helper" ]; then
                echo "FATAL: helper app executable $helper missing or empty after prepare-sidecars"
                exit 1
              fi
              ls -la "$helper"
              ;;
          esac

      - name: Import Apple Developer ID certificate
        if: contains(matrix.target, 'apple-darwin') && github.event.repository.fork == false
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail

          missing=()
          for name in \
            APPLE_CERTIFICATE \
            APPLE_CERTIFICATE_PASSWORD \
            KEYCHAIN_PASSWORD \
            APPLE_ID \
            APPLE_PASSWORD \
            APPLE_TEAM_ID; do
            if [ -z "${!name:-}" ]; then
              missing+=("$name")
            fi
          done

          if [ "${#missing[@]}" -ne 0 ]; then
            printf '::error::Missing required Apple signing secret(s): %s\n' "${missing[*]}"
            exit 1
          fi

          keychain_path="$RUNNER_TEMP/codeg-signing.keychain-db"
          certificate_path="$RUNNER_TEMP/developer-id.p12"
          keychain_search_list_path="$RUNNER_TEMP/codeg-keychains.txt"
          original_default_keychain="$(
            security default-keychain -d user \
              | sed -e 's/^[[:space:]]*//' -e 's/^"//' -e 's/"$//'
          )"
          security list-keychains -d user \
            | sed -e 's/^[[:space:]]*//' -e 's/^"//' -e 's/"$//' \
            > "$keychain_search_list_path"

          echo "APPLE_KEYCHAIN_PATH=$keychain_path" >> "$GITHUB_ENV"
          echo "APPLE_CERTIFICATE_PATH=$certificate_path" >> "$GITHUB_ENV"
          echo "APPLE_KEYCHAIN_SEARCH_LIST_PATH=$keychain_search_list_path" >> "$GITHUB_ENV"
          echo "APPLE_ORIGINAL_DEFAULT_KEYCHAIN=$original_default_keychain" >> "$GITHUB_ENV"

          echo "$APPLE_CERTIFICATE" | base64 --decode > "$certificate_path"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          existing_keychains=()
          while IFS= read -r existing_keychain; do
            if [ -n "$existing_keychain" ]; then
              existing_keychains+=("$existing_keychain")
            fi
          done < "$keychain_search_list_path"
          if [ "${#existing_keychains[@]}" -eq 0 ]; then
            security list-keychains -d user -s "$keychain_path"
          else
            security list-keychains -d user -s "$keychain_path" "${existing_keychains[@]}"
          fi
          security default-keychain -s "$keychain_path"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security set-keychain-settings -t 21600 -u "$keychain_path"
          security import "$certificate_path" \
            -k "$keychain_path" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/productbuild
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$keychain_path"
          security find-identity -v -p codesigning "$keychain_path"

      - name: Resolve Apple Developer ID identity
        if: contains(matrix.target, 'apple-darwin') && github.event.repository.fork == false
        shell: bash
        run: |
          set -euo pipefail
          cert_info="$(
            security find-identity -v -p codesigning "$APPLE_KEYCHAIN_PATH" \
              | grep "Developer ID Application" \
              | head -n 1 \
              || true
          )"

          if [ -z "$cert_info" ]; then
            echo "::error::No Developer ID Application signing identity found in imported keychain."
            security find-identity -v -p codesigning "$APPLE_KEYCHAIN_PATH" || true
            exit 1
          fi

          cert_id="$(echo "$cert_info" | awk -F'"' '{print $2}')"
          echo "APPLE_SIGNING_IDENTITY=$cert_id" >> "$GITHUB_ENV"
          echo "Using Apple signing identity: $cert_id"

      # Tauri copies the helper app into the bundle (`bundle.macOS.files`)
      # without signing it, and signs the bundle around it without `--deep`,
      # so it is signed here, before the bundle is built — inside out, as
      # Apple requires — with the hardened runtime, a secure timestamp and no
      # entitlements, as notarization and the gate below need.
      - name: Sign the computer-use helper app (macOS)
        if: contains(matrix.target, 'apple-darwin')
        shell: bash
        run: |
          set -euo pipefail
          helper_app="src-tauri/binaries/codeg-computer-helper.app"
          codesign --force --options runtime --timestamp \
            --sign "$APPLE_SIGNING_IDENTITY" "$helper_app"
          codesign --verify --strict -R="${CODEG_COMPUTER_HELPER_REQUIREMENT}" "$helper_app"
          codesign -dv "$helper_app" 2>&1 | grep -E '^(Identifier|TeamIdentifier)='

      - name: Build and upload to draft release (Linux arm64)
        if: matrix.target == 'aarch64-unknown-linux-gnu' && github.event.repository.fork == false
        uses: tauri-apps/tauri-action@v0.6.1
        env:
          # The matrix-target sidecar is already staged and verified above.
          # Skip the duplicate beforeBuildCommand sidecar pass so cross builds
          # do not fall back to the runner host triple.
          CODEG_SKIP_SIDECAR: "1"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          PKG_CONFIG_ALLOW_CROSS: 1
          PKG_CONFIG_PATH: /usr/lib/aarch64-linux-gnu/pkgconfig:/usr/share/pkgconfig
          PKG_CONFIG_LIBDIR: /usr/lib/aarch64-linux-gnu/pkgconfig:/usr/share/pkgconfig
          PKG_CONFIG_SYSROOT_DIR: /usr/aarch64-linux-gnu
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_AR: aarch64-linux-gnu-gcc-ar
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_RUSTFLAGS: -Clinker=aarch64-linux-gnu-gcc
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
          CXX_aarch64_unknown_linux_gnu: aarch64-linux-gnu-g++
          AR_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc-ar
        with:
          releaseId: ${{ needs.create-draft-release.outputs.release_id }}
          tagName: ${{ github.ref_name }}
          releaseBody: ${{ needs.create-draft-release.outputs.release_body }}
          releaseDraft: true
          prerelease: ${{ needs.create-draft-release.outputs.prerelease }}
          tauriScript: pnpm tauri
          # RPM takes no "-" in a version and the bundler stops at "invalid
          # version", so a release candidate (x.y.z-rc.N) ships no .rpm. The
          # tag is "v" + the version: create-draft-release makes sure of it.
          args: --target ${{ matrix.target }} --bundles ${{ contains(github.ref_name, '-') && 'deb' || 'deb,rpm' }}
          includeUpdaterJson: false
          retryAttempts: 2

      - name: Build and upload to draft release (Windows)
        if: contains(matrix.target, 'windows') && github.event.repository.fork == false
        uses: tauri-apps/tauri-action@v0.6.1
        env:
          # The matrix-target sidecar is already staged and verified above.
          # Skip the duplicate beforeBuildCommand sidecar pass so cross builds
          # do not fall back to the runner host triple.
          CODEG_SKIP_SIDECAR: "1"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.create-draft-release.outputs.release_id }}
          tagName: ${{ github.ref_name }}
          releaseBody: ${{ needs.create-draft-release.outputs.release_body }}
          releaseDraft: true
          prerelease: ${{ needs.create-draft-release.outputs.prerelease }}
          tauriScript: pnpm tauri
          # Skip MSI bundling on Windows: tauri-apps/tauri#14681 — light.exe
          # fails when externalBin is configured. NSIS installer + updater
          # artifacts cover the same distribution channel.
          args: --target ${{ matrix.target }} --bundles nsis,updater
          includeUpdaterJson: true
          retryAttempts: 2

      - name: Build and upload to draft release (Linux x64)
        if: matrix.target == 'x86_64-unknown-linux-gnu' && github.event.repository.fork == false
        uses: tauri-apps/tauri-action@v0.6.1
        env:
          # The matrix-target sidecar is already staged and verified above.
          # Skip the duplicate beforeBuildCommand sidecar pass so cross builds
          # do not fall back to the runner host triple.
          CODEG_SKIP_SIDECAR: "1"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.create-draft-release.outputs.release_id }}
          tagName: ${{ github.ref_name }}
          releaseBody: ${{ needs.create-draft-release.outputs.release_body }}
          releaseDraft: true
          prerelease: ${{ needs.create-draft-release.outputs.prerelease }}
          tauriScript: pnpm tauri
          # Every Linux bundle (deb, rpm, AppImage), less the .rpm for a
          # release candidate: see the arm64 step.
          args: --target ${{ matrix.target }}${{ contains(github.ref_name, '-') && ' --bundles deb,appimage' || '' }}
          includeUpdaterJson: true
          retryAttempts: 2

      - name: Build, sign, and upload to draft release (macOS)
        if: contains(matrix.target, 'apple-darwin') && github.event.repository.fork == false
        uses: tauri-apps/tauri-action@v0.6.1
        env:
          # The matrix-target sidecar is already staged and verified above.
          # Skip the duplicate beforeBuildCommand sidecar pass so cross builds
          # do not fall back to the runner host triple.
          CODEG_SKIP_SIDECAR: "1"
          # beforeBuildCommand runs `next build`, whose type-check needs more
          # than the 2 GB heap Node defaults to on these 7 GB runners; 4 GB is
          # what Node already gets on the 16 GB Linux and Windows runners.
          NODE_OPTIONS: --max-old-space-size=4096
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Tauri notarizes the signed bundle when these three env vars are
          # present (in addition to the imported Developer ID cert +
          # APPLE_SIGNING_IDENTITY used for code signing).
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          releaseId: ${{ needs.create-draft-release.outputs.release_id }}
          tagName: ${{ github.ref_name }}
          releaseBody: ${{ needs.create-draft-release.outputs.release_body }}
          releaseDraft: true
          prerelease: ${{ needs.create-draft-release.outputs.prerelease }}
          tauriScript: pnpm tauri
          args: --target ${{ matrix.target }}
          includeUpdaterJson: true
          retryAttempts: 2

      # The release gate for computer use on macOS. Notarization and a
      # `runtime` flag prove neither of the things that matter here, so each is
      # checked on the bundle that was just built and signed:
      #   * the helper is an app of its own, `Contents/Helpers/
      #     codeg-computer-helper.app`, and no bare copy of it is in
      #     `Contents/MacOS/`: macOS charges an executable's permissions to the
      #     app bundle it sits in, so a helper there would hold codeg's;
      #   * codeg, codeg-mcp and codeg-computer-helper carry NO entitlements —
      #     in particular none that let another process load code into them
      #     (library-validation / dyld / get-task-allow exemptions), and codeg
      #     never Apple Events: every agent's shell runs as codeg for TCC.
      #   * each has the hardened runtime;
      #   * codeg satisfies the requirement compiled into the helper, and the
      #     helper the one compiled into codeg — otherwise the two refuse each
      #     other and computer use cannot start;
      #   * codeg and codeg-mcp reference no Accessibility / event-posting /
      #     screen-capture API: holding or using those is the helper's job
      #     alone. `AXIsProcessTrusted` is the one allowed read-only query.
      #     codeg alone may also import `CGEventTapCreate`: global-hotkey,
      #     behind the stop shortcut, links it to watch media keys, and codeg
      #     never asks it to — `StopShortcut` names no media key and no webview
      #     is given the shortcut plugin, both held by tests. Nothing else is
      #     let through.
      #   * the bundle carries no `codeg-server`, and its `codeg-mcp` is the
      #     sidecar built without the desktop features (no WebKit): the copies
      #     `tauri build` compiles itself stay out (`server-bin` / `mcp-bin`).
      - name: Verify computer-use signing and symbols (macOS)
        if: contains(matrix.target, 'apple-darwin')
        shell: bash
        run: |
          set -euo pipefail
          app="src-tauri/target/${{ matrix.target }}/release/bundle/macos/codeg.app"
          if [ ! -d "$app" ]; then
            echo "FATAL: $app not found"
            exit 1
          fi
          codesign --verify --strict --deep "$app"
          helper_app="$app/Contents/Helpers/codeg-computer-helper.app"
          if [ -e "$app/Contents/MacOS/codeg-computer-helper" ]; then
            echo "FATAL: codeg-computer-helper is in Contents/MacOS, where macOS charges it to codeg"
            exit 1
          fi
          if [ ! -d "$helper_app" ]; then
            echo "FATAL: $helper_app not found"
            exit 1
          fi
          if [ -e "$app/Contents/MacOS/codeg-server" ]; then
            echo "FATAL: codeg-server is in the desktop bundle; its binary target must need server-bin"
            exit 1
          fi
          if otool -L "$app/Contents/MacOS/codeg-mcp" | grep -q 'WebKit'; then
            echo "FATAL: codeg-mcp links WebKit: tauri build's own copy replaced the sidecar"
            exit 1
          fi
          for path in "$app/Contents/MacOS/codeg" "$app/Contents/MacOS/codeg-mcp" "$helper_app"; do
            name="$(basename "$path")"
            if ! codesign -dv "$path" 2>&1 | grep -q 'flags=0x[0-9a-f]*(runtime)'; then
              echo "FATAL: $name is not signed with the hardened runtime"
              exit 1
            fi
            if codesign -d --entitlements - --xml "$path" 2>/dev/null | grep -q '<key>'; then
              echo "FATAL: $name carries entitlements; codeg's executables must carry none"
              codesign -d --entitlements - "$path" || true
              exit 1
            fi
          done
          codesign --verify --strict -R="${CODEG_COMPUTER_PEER_REQUIREMENT}" "$app/Contents/MacOS/codeg"
          codesign --verify --strict -R="${CODEG_COMPUTER_HELPER_REQUIREMENT}" "$helper_app"
          deny='^_(CGEventPost|CGEventPostToPid|CGEventPostToPSN|CGEventTapCreate|CGEventTapCreateForPid|CGEventTapCreateForPSN|CGWindowListCreateImage|CGWindowListCreateImageFromArray|CGDisplayCreateImage|CGDisplayCreateImageForRect|CGDisplayStreamCreate|CGDisplayStreamCreateWithDispatchQueue|CGRequestScreenCaptureAccess|CGRequestPostEventAccess|AXIsProcessTrustedWithOptions|AXUIElement[A-Za-z]*|AXObserver[A-Za-z]*)$|^_OBJC_CLASS_\$_SC(ShareableContent|Stream|ScreenshotManager|ContentFilter|ContentSharingPicker)$'
          for bin in codeg codeg-mcp; do
            hits="$(nm -u "$app/Contents/MacOS/$bin" | grep -E "$deny" || true)"
            if [ "$bin" = codeg ]; then
              hits="$(printf '%s\n' "$hits" | grep -vx '_CGEventTapCreate' || true)"
            fi
            if [ -n "$hits" ]; then
              echo "FATAL: $bin references APIs only codeg-computer-helper may use:"
              echo "$hits"
              exit 1
            fi
          done
          echo "computer-use signing and symbol checks passed"
      # Forks do not receive upstream repository secrets. Build ordinary
      # installable bundles, but explicitly disable updater artifacts: those
      # must never be published without the updater signing key.
      - name: Build and upload unsigned fork bundle (Linux arm64)
        if: matrix.target == 'aarch64-unknown-linux-gnu' && github.event.repository.fork == true
        uses: tauri-apps/tauri-action@v0.6.1
        env:
          CODEG_SKIP_SIDECAR: "1"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PKG_CONFIG_ALLOW_CROSS: 1
          PKG_CONFIG_PATH: /usr/lib/aarch64-linux-gnu/pkgconfig:/usr/share/pkgconfig
          PKG_CONFIG_LIBDIR: /usr/lib/aarch64-linux-gnu/pkgconfig:/usr/share/pkgconfig
          PKG_CONFIG_SYSROOT_DIR: /usr/aarch64-linux-gnu
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_AR: aarch64-linux-gnu-gcc-ar
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_RUSTFLAGS: -Clinker=aarch64-linux-gnu-gcc
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
          CXX_aarch64_unknown_linux_gnu: aarch64-linux-gnu-g++
          AR_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc-ar
        with:
          releaseId: ${{ needs.create-draft-release.outputs.release_id }}
          tagName: ${{ github.ref_name }}
          releaseBody: ${{ needs.create-draft-release.outputs.release_body }}
          releaseDraft: true
          prerelease: ${{ needs.create-draft-release.outputs.prerelease }}
          tauriScript: pnpm tauri
          args: --target ${{ matrix.target }} --bundles deb,rpm --config '{"bundle":{"createUpdaterArtifacts":false}}'
          includeUpdaterJson: false
          retryAttempts: 2

      - name: Build and upload unsigned fork bundle (Linux x64)
        if: matrix.target == 'x86_64-unknown-linux-gnu' && github.event.repository.fork == true
        uses: tauri-apps/tauri-action@v0.6.1
        env:
          CODEG_SKIP_SIDECAR: "1"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.create-draft-release.outputs.release_id }}
          tagName: ${{ github.ref_name }}
          releaseBody: ${{ needs.create-draft-release.outputs.release_body }}
          releaseDraft: true
          prerelease: ${{ needs.create-draft-release.outputs.prerelease }}
          tauriScript: pnpm tauri
          args: --target ${{ matrix.target }} --config '{"bundle":{"createUpdaterArtifacts":false}}'
          includeUpdaterJson: false
          retryAttempts: 2

      - name: Build and upload unsigned fork bundle (Windows)
        if: contains(matrix.target, 'windows') && github.event.repository.fork == true
        uses: tauri-apps/tauri-action@v0.6.1
        env:
          CODEG_SKIP_SIDECAR: "1"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.create-draft-release.outputs.release_id }}
          tagName: ${{ github.ref_name }}
          releaseBody: ${{ needs.create-draft-release.outputs.release_body }}
          releaseDraft: true
          prerelease: ${{ needs.create-draft-release.outputs.prerelease }}
          tauriScript: pnpm tauri
          args: --target ${{ matrix.target }} --bundles nsis --config '{"bundle":{"createUpdaterArtifacts":false}}'
          includeUpdaterJson: false
          retryAttempts: 2

      - name: Install and verify Windows fork Setup, then upload checksum
        if: runner.os == 'Windows' && github.event.repository.fork == true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:RELEASE_TAG.TrimStart('v')
          $built = "src-tauri/target/${{ matrix.target }}/release"
          $setups = @(Get-ChildItem "$built/bundle/nsis/*_x64-setup.exe")
          if ($setups.Count -ne 1 -or $setups[0].Name -ne "codeg_${version}_x64-setup.exe") { throw 'Unexpected Setup filename or count' }
          $setup = $setups[0]
          $dest = Join-Path $env:RUNNER_TEMP 'codeg-setup-verified'
          $process = Start-Process $setup.FullName -ArgumentList '/S',"/D=$dest" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Setup installation failed: $($process.ExitCode)" }
          python -B scripts/verify-setup-binaries.py $built $dest
          if ($LASTEXITCODE -ne 0) { throw 'Setup binary verification failed' }
          $info = (Get-Item (Join-Path $dest 'codeg.exe')).VersionInfo
          $numeric = ($version -split '-')[0]
          if ($info.ProductVersion -notin @($version, $numeric, "$numeric.0")) { throw 'Setup executable version mismatch' }
          $mcpVersion = (& (Join-Path $dest 'codeg-mcp.exe') --version | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $mcpVersion -ne $version) { throw 'Setup MCP version mismatch' }
          $files = @()
          foreach ($name in @('codeg.exe','codeg-mcp.exe','codeg-computer-helper.exe','codeg-cli.exe')) {
            $files += @{ path=$name; sha256=(Get-FileHash (Join-Path $dest $name) -Algorithm SHA256).Hash.ToLower() }
          }
          $out = (Resolve-Path out).Path
          foreach ($file in (Get-ChildItem out -Recurse -File)) {
            $relative = $file.FullName.Substring($out.Length + 1)
            $installed = Join-Path $dest "web/$relative"
            $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLower()
            if (-not (Test-Path $installed -PathType Leaf) -or (Get-FileHash $installed -Algorithm SHA256).Hash.ToLower() -ne $hash) { throw "Setup static resource mismatch: $relative" }
            $files += @{ path="web/$relative"; sha256=$hash }
          }
          if (-not (Test-Path (Join-Path $dest 'web/index.html') -PathType Leaf)) { throw 'Setup web entry missing' }
          python -B scripts/build-pi-runtime.py --output-dir (Join-Path $dest 'pi-runtime') --verify
          if ($LASTEXITCODE -ne 0) { throw 'Setup Pi runtime inventory failed' }
          $piRoot=(Resolve-Path (Join-Path $dest 'pi-runtime')).Path
          foreach ($file in (Get-ChildItem $piRoot -Recurse -File)) {
            $relative=$file.FullName.Substring($piRoot.Length+1)
            $files += @{ path="pi-runtime/$relative"; sha256=(Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLower() }
          }
          python -B scripts/build-codex-adapter.py --output-dir (Join-Path $dest 'runtime') --verify
          if ($LASTEXITCODE -ne 0) { throw 'Setup Codex adapter inventory failed' }
          $runtimeRoot=(Resolve-Path dist/codex-runtime).Path
          foreach ($file in (Get-ChildItem $runtimeRoot -Recurse -File)) {
            $relative=$file.FullName.Substring($runtimeRoot.Length+1)
            $hash=(Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLower()
            $installed=Join-Path $dest "runtime/$relative"
            if (-not (Test-Path $installed -PathType Leaf) -or (Get-FileHash $installed -Algorithm SHA256).Hash.ToLower() -ne $hash) { throw "Setup Codex runtime resource mismatch: $relative" }
            $files += @{ path="runtime/$relative"; sha256=$hash }
          }
          if (Get-ChildItem $dest -Recurse -File | Where-Object { $_.Name -in @('auth.json','tokens.json','config.toml','.env') -or $_.Extension -in @('.db','.sqlite','.sqlite3','.pdb','.key') }) { throw 'Unexpected data/build files in Setup' }
          New-Item -ItemType Directory -Force setup-evidence | Out-Null
          @{ version=$version; commit=$env:GITHUB_SHA; files=$files } | ConvertTo-Json -Depth 5 | Set-Content setup-evidence/payload.json
          $hash = (Get-FileHash $setup.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($setup.Name)" | Set-Content -Encoding ascii "$($setup.FullName).sha256"
          gh release upload $env:RELEASE_TAG "$($setup.FullName).sha256" --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { throw 'Setup checksum upload failed' }

      - name: Retain Setup verification manifest
        if: runner.os == 'Windows' && github.event.repository.fork == true
        uses: actions/upload-artifact@v4
        with:
          name: release-windows-setup-evidence
          path: setup-evidence/payload.json
          if-no-files-found: error
          retention-days: 14

      - name: Build and upload unsigned fork bundle (macOS)
        if: contains(matrix.target, 'apple-darwin') && github.event.repository.fork == true
        uses: tauri-apps/tauri-action@v0.6.1
        env:
          CODEG_SKIP_SIDECAR: "1"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.create-draft-release.outputs.release_id }}
          tagName: ${{ github.ref_name }}
          releaseBody: ${{ needs.create-draft-release.outputs.release_body }}
          releaseDraft: true
          prerelease: ${{ needs.create-draft-release.outputs.prerelease }}
          tauriScript: pnpm tauri
          args: --target ${{ matrix.target }} --bundles dmg --config '{"bundle":{"createUpdaterArtifacts":false}}'
          includeUpdaterJson: false
          retryAttempts: 2

      - name: Delete Apple signing keychain
        if: always() && contains(matrix.target, 'apple-darwin') && github.event.repository.fork == false
        shell: bash
        run: |
          if [ -n "${APPLE_ORIGINAL_DEFAULT_KEYCHAIN:-}" ]; then
            security default-keychain -s "$APPLE_ORIGINAL_DEFAULT_KEYCHAIN" || true
          fi

          if [ -n "${APPLE_KEYCHAIN_SEARCH_LIST_PATH:-}" ] && \
             [ -f "$APPLE_KEYCHAIN_SEARCH_LIST_PATH" ]; then
            restored_keychains=()
            while IFS= read -r restored_keychain; do
              if [ -n "$restored_keychain" ]; then
                restored_keychains+=("$restored_keychain")
              fi
            done < "$APPLE_KEYCHAIN_SEARCH_LIST_PATH"

            if [ "${#restored_keychains[@]}" -ne 0 ]; then
              security list-keychains -d user -s "${restored_keychains[@]}" || true
            fi
          fi

          if [ -n "${APPLE_KEYCHAIN_PATH:-}" ]; then
            security delete-keychain "$APPLE_KEYCHAIN_PATH" || true
          fi

          for path in \
            "${APPLE_CERTIFICATE_PATH:-}" \
            "${APPLE_KEYCHAIN_SEARCH_LIST_PATH:-}"; do
            if [ -n "$path" ]; then
              rm -f "$path"
            fi
          done

  build-server:
    needs: create-draft-release
    name: Server ${{ matrix.name }}
    permissions:
      contents: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "Windows x64"
            runner: "windows-2022"
            target: "x86_64-pc-windows-msvc"
            artifact: "codeg-server-windows-x64"
            archive: "codeg-server-windows-x64.zip"
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        env:
          CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: "-C target-feature=+crt-static"
        with:
          workspaces: "./src-tauri -> target"
          shared-key: server-${{ matrix.target }}

      - name: Install Linux arm64 cross compiler
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          cat > /tmp/sources.list << 'EOF'
          deb [arch=amd64] http://archive.ubuntu.com/ubuntu jammy main restricted universe multiverse
          deb [arch=amd64] http://archive.ubuntu.com/ubuntu jammy-updates main restricted universe multiverse
          deb [arch=amd64] http://archive.ubuntu.com/ubuntu jammy-backports main restricted universe multiverse
          deb [arch=amd64] http://security.ubuntu.com/ubuntu jammy-security main restricted universe multiverse

          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy main restricted universe multiverse
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy-updates main restricted universe multiverse
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy-backports main restricted universe multiverse
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy-security main restricted universe multiverse
          EOF
          sudo mv /etc/apt/sources.list /etc/apt/sources.list.default
          sudo mv /tmp/sources.list /etc/apt/sources.list

          sudo dpkg --add-architecture arm64
          sudo apt-get update
          # libssl3 is Multi-Arch: same; align the preinstalled :amd64 copy
          # with the version libssl-dev:arm64 pins so the cross install isn't
          # blocked by a held-back amd64 copy (same failure mode as the desktop
          # arm64 build — see the build-tauri step for the full rationale).
          sudo apt-get install -y --only-upgrade libssl3
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            libssl-dev:arm64
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_ALLOW_CROSS=1" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=/usr/lib/aarch64-linux-gnu/pkgconfig:/usr/share/pkgconfig" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_LIBDIR=/usr/lib/aarch64-linux-gnu/pkgconfig:/usr/share/pkgconfig" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_SYSROOT_DIR=/usr/aarch64-linux-gnu" >> "$GITHUB_ENV"
          echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
          echo "CXX_aarch64_unknown_linux_gnu=aarch64-linux-gnu-g++" >> "$GITHUB_ENV"
          echo "AR_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc-ar" >> "$GITHUB_ENV"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - name: Build frontend
        env:
          # The `next build` type-check needs more than the 2 GB heap Node
          # defaults to on the 7 GB macOS runners. 4 GB is what Node already
          # gets on the 16 GB Linux and Windows runners, so it changes nothing
          # there.
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          pnpm release:resources

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Reuse the tested runtime from the exact successful ordinary CI
        id: tested-runtime
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $sourceSha=(git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Cannot resolve checked-out source' }
          $runs=gh run list --repo $env:GITHUB_REPOSITORY --workflow test.yml --commit $sourceSha --branch '${{ github.event.repository.default_branch }}' --status success --limit 20 --json databaseId,headSha,event,conclusion | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Cannot read ordinary CI provenance' }
          $run=@($runs | Where-Object { $_.headSha -eq $sourceSha -and $_.event -eq 'push' -and $_.conclusion -eq 'success' }) | Select-Object -First 1
          $artifact=$null
          if ($run) {
            $listing=gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$($run.databaseId)/artifacts?per_page=100" | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0) { throw 'Cannot read runtime artifact metadata' }
            $artifact=@($listing.artifacts | Where-Object { $_.name -eq 'tested-codex-runtime-Windows-X64' -and -not $_.expired }) | Select-Object -First 1
          }
          if (-not $artifact) {
            # Old tags and expired artifacts retain the reproducible source build.
            "reused=false" >> $env:GITHUB_OUTPUT
            exit 0
          }
          if ($artifact.workflow_run.head_sha -ne $sourceSha) { throw 'Runtime artifact source mismatch' }
          gh run download $run.databaseId --repo $env:GITHUB_REPOSITORY --name $artifact.name --dir dist/codex-runtime
          if ($LASTEXITCODE -ne 0) { throw 'Tested runtime download failed' }
          $root=(Resolve-Path dist/codex-runtime).Path
          $actual=Get-Content (Join-Path $root 'source.json') -Raw | ConvertFrom-Json | ConvertTo-Json -Compress
          $expected=Get-Content vendor/codex-runtime/source.json -Raw | ConvertFrom-Json | ConvertTo-Json -Compress
          if ($actual -ne $expected) { throw 'Runtime source pin does not match release' }
          foreach ($line in Get-Content (Join-Path $root 'runtime.sha256')) {
            if ($line -notmatch '^([a-f0-9]{64})  ([a-zA-Z0-9_./-]+)$') { throw 'Invalid runtime checksum entry' }
            $hash=$Matches[1]; $name=$Matches[2]
            $path=[IO.Path]::GetFullPath((Join-Path $root $name))
            if (-not $path.StartsWith("$root\", [StringComparison]::OrdinalIgnoreCase)) { throw 'Runtime checksum path escapes bundle' }
            if ((Get-FileHash $path -Algorithm SHA256).Hash.ToLower() -ne $hash) { throw "Runtime hash mismatch: $name" }
          }
          @{ commit=$sourceSha; workflow='test.yml'; run_id=$run.databaseId; artifact_id=$artifact.id; artifact_digest=$artifact.digest } | ConvertTo-Json | Set-Content (Join-Path $root 'ci-provenance.json')
          "reused=true" >> $env:GITHUB_OUTPUT

      - name: Prepare pinned recovery source for the native build cache
        if: matrix.target == 'x86_64-pc-windows-msvc' && steps.tested-runtime.outputs.reused != 'true'
        shell: pwsh
        run: |
          rustup toolchain install 1.95.0 --profile minimal --component clippy
          if ($LASTEXITCODE -ne 0) { throw 'Pinned Rust toolchain installation failed' }
          python -B scripts/build-codex-runtime.py --source-dir "$env:RUNNER_TEMP/codeg-codex-source" --output-dir "dist/codex-runtime" --prepare-only
          if ($LASTEXITCODE -ne 0) { throw 'Pinned runtime source preparation failed' }

      - name: Cache pinned recovery compilation
        if: matrix.target == 'x86_64-pc-windows-msvc' && steps.tested-runtime.outputs.reused != 'true'
        uses: swatinem/rust-cache@v2
        env:
          RUST_BACKTRACE: short
          CARGO_BUILD_JOBS: 1
          CARGO_PROFILE_DEV_DEBUG: "0"
          CARGO_PROFILE_TEST_DEBUG: "0"
        with:
          workspaces: "${{ runner.temp }}/codeg-codex-source/codex-rs -> ../../codeg-codex-target"
          shared-key: codex-recovery-target-v3-${{ matrix.runner }}-${{ hashFiles('vendor/codex-runtime/**', 'scripts/build-codex-runtime.py', '.github/workflows/test.yml') }}
          cache-workspace-crates: true
          cache-on-failure: true

      - name: Build pinned Codex recovery runtime
        if: matrix.target == 'x86_64-pc-windows-msvc' && steps.tested-runtime.outputs.reused != 'true'
        shell: pwsh
        env:
          RUST_BACKTRACE: short
          CARGO_BUILD_JOBS: 1
          CARGO_PROFILE_DEV_DEBUG: "0"
          CARGO_PROFILE_TEST_DEBUG: "0"
          CARGO_TARGET_DIR: ${{ runner.temp }}/codeg-codex-target
        run: |
          python -B scripts/build-codex-runtime.py --source-dir "$env:RUNNER_TEMP/codeg-codex-source" --output-dir "dist/codex-runtime"

      - name: Build server + codeg-mcp companion + computer-use helper
        working-directory: src-tauri
        env:
          # The separate pinned CLI already sets static CRT in its own builder.
          CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: "-C target-feature=+crt-static"
        # `codeg-mcp` is the stdio MCP companion the runtime injects per
        # session (see acp/delegation/companion.rs). Built with the same
        # `--no-default-features --target` flags as the server so it shares
        # the cross-compile env (Linux arm64) without dragging in tauri
        # runtime deps. Each binary target needs its own feature (Cargo.toml).
        # `codeg-computer-helper` serves computer use, which the server
        # offers only when started with CODEG_COMPUTER_USE=1 in a desktop
        # session; it ships beside the server, where the server looks for it.
        run: |
          cargo build --release --bin codeg-server --no-default-features --features server-bin --target ${{ matrix.target }}
          cargo build --release --bin codeg-mcp --no-default-features --features mcp-bin --target ${{ matrix.target }}
          cargo build --release --bin codeg-computer-helper --no-default-features --features computer-helper --target ${{ matrix.target }}
          cargo build --release --bin codeg-cli --no-default-features --features cli-bin --target ${{ matrix.target }}

      # macOS holds what a person grants the server — Full Disk Access and the
      # other privacy permissions — to its designated requirement. Rust leaves
      # the arm64 binary linker-signed (ad-hoc), which makes that requirement
      # the one build's cdhash: every update, which puts another build at the
      # same path, took the grant back (#1035). The x86_64 binary is not
      # signed at all. Signed with the release's Developer ID under a fixed
      # identifier, both carry a requirement naming the identifier and the
      # Team ID, which every release keeps, as the desktop's executables do.
      # The certificate goes into a temporary keychain the way build-tauri
      # does it, after everything is built, and the keychain is deleted again
      # before anything else runs, so no build script or tool sees it
      # unlocked. No notarization credentials: these binaries are not
      # notarized.
      - name: Import Apple Developer ID certificate (macOS)
        if: contains(matrix.target, 'apple-darwin')
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail

          missing=()
          for name in \
            APPLE_CERTIFICATE \
            APPLE_CERTIFICATE_PASSWORD \
            KEYCHAIN_PASSWORD \
            APPLE_TEAM_ID; do
            if [ -z "${!name:-}" ]; then
              missing+=("$name")
            fi
          done

          if [ "${#missing[@]}" -ne 0 ]; then
            printf '::error::Missing required Apple signing secret(s): %s\n' "${missing[*]}"
            exit 1
          fi

          keychain_path="$RUNNER_TEMP/codeg-signing.keychain-db"
          certificate_path="$RUNNER_TEMP/developer-id.p12"
          keychain_search_list_path="$RUNNER_TEMP/codeg-keychains.txt"
          original_default_keychain="$(
            security default-keychain -d user \
              | sed -e 's/^[[:space:]]*//' -e 's/^"//' -e 's/"$//'
          )"
          security list-keychains -d user \
            | sed -e 's/^[[:space:]]*//' -e 's/^"//' -e 's/"$//' \
            > "$keychain_search_list_path"

          echo "APPLE_KEYCHAIN_PATH=$keychain_path" >> "$GITHUB_ENV"
          echo "APPLE_CERTIFICATE_PATH=$certificate_path" >> "$GITHUB_ENV"
          echo "APPLE_KEYCHAIN_SEARCH_LIST_PATH=$keychain_search_list_path" >> "$GITHUB_ENV"
          echo "APPLE_ORIGINAL_DEFAULT_KEYCHAIN=$original_default_keychain" >> "$GITHUB_ENV"

          echo "$APPLE_CERTIFICATE" | base64 --decode > "$certificate_path"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          existing_keychains=()
          while IFS= read -r existing_keychain; do
            if [ -n "$existing_keychain" ]; then
              existing_keychains+=("$existing_keychain")
            fi
          done < "$keychain_search_list_path"
          if [ "${#existing_keychains[@]}" -eq 0 ]; then
            security list-keychains -d user -s "$keychain_path"
          else
            security list-keychains -d user -s "$keychain_path" "${existing_keychains[@]}"
          fi
          security default-keychain -s "$keychain_path"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security set-keychain-settings -t 21600 -u "$keychain_path"
          security import "$certificate_path" \
            -k "$keychain_path" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$keychain_path"
          security find-identity -v -p codesigning "$keychain_path"

      - name: Resolve Apple Developer ID identity (macOS)
        if: contains(matrix.target, 'apple-darwin')
        shell: bash
        run: |
          set -euo pipefail
          cert_info="$(
            security find-identity -v -p codesigning "$APPLE_KEYCHAIN_PATH" \
              | grep "Developer ID Application" \
              | head -n 1 \
              || true
          )"

          if [ -z "$cert_info" ]; then
            echo "::error::No Developer ID Application signing identity found in imported keychain."
            security find-identity -v -p codesigning "$APPLE_KEYCHAIN_PATH" || true
            exit 1
          fi

          cert_id="$(echo "$cert_info" | awk -F'"' '{print $2}')"
          echo "APPLE_SIGNING_IDENTITY=$cert_id" >> "$GITHUB_ENV"
          echo "Using Apple signing identity: $cert_id"

      # Each executable is signed under its file name as its identifier (the
      # names the desktop bundle signs codeg-mcp and codeg-cli under), with
      # the hardened runtime, a secure timestamp and no entitlements. A grant
      # that outlives an update must not be borrowable by loading code into
      # the server — DYLD_* variables, a library it did not ship — and a
      # signature without a secure timestamp stops validating once the
      # certificate expires. Then each is checked against the requirement
      # macOS records for it. codeg-computer-helper stays ad-hoc: a helper
      # carrying a Team ID refuses to start unless codeg's designated
      # requirement was compiled into it (computer/helper/mod.rs), and this
      # build pins none. Last, the signed server is run once (`--version`) to
      # show it still launches under the hardened runtime.
      - name: Sign the server's executables with the Developer ID (macOS)
        if: contains(matrix.target, 'apple-darwin')
        shell: bash
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          dir="src-tauri/target/${{ matrix.target }}/release"
          anchor="anchor apple generic and certificate 1[field.1.2.840.113635.100.6.2.6] /* exists */ and certificate leaf[field.1.2.840.113635.100.6.1.13] /* exists */ and certificate leaf[subject.OU] = \"${APPLE_TEAM_ID}\""
          for bin in codeg-server codeg-mcp codeg-cli; do
            codesign --force --options runtime --timestamp \
              --identifier "$bin" \
              --sign "$APPLE_SIGNING_IDENTITY" "$dir/$bin"
            codesign --verify --strict -R="identifier \"$bin\" and ${anchor}" "$dir/$bin"
            info="$(codesign -dv --verbose=2 "$dir/$bin" 2>&1)"
            if ! grep -q 'flags=0x[0-9a-f]*(runtime)' <<< "$info"; then
              echo "FATAL: $bin is not signed with the hardened runtime"
              exit 1
            fi
            if ! grep -q '^Timestamp=' <<< "$info"; then
              echo "FATAL: $bin carries no secure timestamp"
              exit 1
            fi
            entitlements="$(codesign -d --entitlements - --xml "$dir/$bin" 2>/dev/null)"
            if grep -q '<key>' <<< "$entitlements"; then
              echo "FATAL: $bin carries entitlements; the server's executables must carry none"
              exit 1
            fi
            grep -E '^(Identifier|TeamIdentifier|Timestamp)=' <<< "$info"
          done
          "$dir/codeg-server" --version

      - name: Delete Apple signing keychain (macOS)
        if: always() && contains(matrix.target, 'apple-darwin')
        shell: bash
        run: |
          if [ -n "${APPLE_ORIGINAL_DEFAULT_KEYCHAIN:-}" ]; then
            security default-keychain -s "$APPLE_ORIGINAL_DEFAULT_KEYCHAIN" || true
          fi

          if [ -n "${APPLE_KEYCHAIN_SEARCH_LIST_PATH:-}" ] && \
             [ -f "$APPLE_KEYCHAIN_SEARCH_LIST_PATH" ]; then
            restored_keychains=()
            while IFS= read -r restored_keychain; do
              if [ -n "$restored_keychain" ]; then
                restored_keychains+=("$restored_keychain")
              fi
            done < "$APPLE_KEYCHAIN_SEARCH_LIST_PATH"

            if [ "${#restored_keychains[@]}" -ne 0 ]; then
              security list-keychains -d user -s "${restored_keychains[@]}" || true
            fi
          fi

          if [ -n "${APPLE_KEYCHAIN_PATH:-}" ]; then
            security delete-keychain "$APPLE_KEYCHAIN_PATH" || true
          fi

          for path in \
            "${APPLE_CERTIFICATE_PATH:-}" \
            "${APPLE_KEYCHAIN_SEARCH_LIST_PATH:-}"; do
            if [ -n "$path" ]; then
              rm -f "$path"
            fi
          done

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist/${{ matrix.artifact }}
          cp src-tauri/target/${{ matrix.target }}/release/codeg-server dist/${{ matrix.artifact }}/
          cp src-tauri/target/${{ matrix.target }}/release/codeg-mcp dist/${{ matrix.artifact }}/
          cp src-tauri/target/${{ matrix.target }}/release/codeg-cli dist/${{ matrix.artifact }}/
          cp src-tauri/target/${{ matrix.target }}/release/codeg-computer-helper dist/${{ matrix.artifact }}/
          chmod +x dist/${{ matrix.artifact }}/codeg-server dist/${{ matrix.artifact }}/codeg-mcp dist/${{ matrix.artifact }}/codeg-computer-helper dist/${{ matrix.artifact }}/codeg-cli
          cp -r out dist/${{ matrix.artifact }}/web
          cd dist && tar czf ${{ matrix.artifact }}.tar.gz ${{ matrix.artifact }}

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/${{ matrix.artifact }}
          Copy-Item src-tauri/target/${{ matrix.target }}/release/codeg-server.exe dist/${{ matrix.artifact }}/
          Copy-Item src-tauri/target/${{ matrix.target }}/release/codeg-mcp.exe dist/${{ matrix.artifact }}/
          Copy-Item src-tauri/target/${{ matrix.target }}/release/codeg-cli.exe dist/${{ matrix.artifact }}/
          python -B scripts/build-codex-adapter.py --output-dir dist/codex-runtime
          if ($LASTEXITCODE -ne 0) { throw 'Server private Codex ACP staging failed' }
          Copy-Item -Recurse dist/codex-runtime "dist/${{ matrix.artifact }}/runtime"
          python -B scripts/build-pi-runtime.py --output-dir dist/pi-runtime
          if ($LASTEXITCODE -ne 0) { throw 'Private Pi runtime build failed' }
          Copy-Item -Recurse dist/pi-runtime "dist/${{ matrix.artifact }}/pi-runtime"
          Copy-Item src-tauri/target/${{ matrix.target }}/release/codeg-computer-helper.exe dist/${{ matrix.artifact }}/
          Copy-Item -Recurse out dist/${{ matrix.artifact }}/web
          Compress-Archive -Path dist/${{ matrix.artifact }} -DestinationPath dist/${{ matrix.artifact }}.zip

      - name: Smoke test packaged artifact (Unix)
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          test -x "dist/${{ matrix.artifact }}/codeg-server"
          test -x "dist/${{ matrix.artifact }}/codeg-mcp"
          test -x "dist/${{ matrix.artifact }}/codeg-computer-helper"
          # `codeg-mcp --help` exits 0 without flags and prints the usage
          # line. Only run it for native targets; cross-compiled arm64
          # binaries on x64 runners can't execute.
          if [ "${{ matrix.target }}" = "x86_64-unknown-linux-gnu" ] || \
             [ "${{ matrix.target }}" = "x86_64-apple-darwin" ] || \
             [ "${{ matrix.target }}" = "aarch64-apple-darwin" ]; then
            "dist/${{ matrix.artifact }}/codeg-mcp" --help | grep -F 'codeg-mcp --parent-connection-id'
          else
            echo "skipping codeg-mcp --help on cross-target ${{ matrix.target }}"
          fi

      - name: Smoke test packaged artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/${{ matrix.artifact }}/codeg-server.exe")) {
            throw "codeg-server.exe missing from packaged artifact"
          }
          if (-not (Test-Path "dist/${{ matrix.artifact }}/codeg-mcp.exe")) {
            throw "codeg-mcp.exe missing from packaged artifact"
          }
          if (-not (Test-Path "dist/${{ matrix.artifact }}/codeg-computer-helper.exe")) {
            throw "codeg-computer-helper.exe missing from packaged artifact"
          }
          $help = & "dist/${{ matrix.artifact }}/codeg-mcp.exe" --help
          if ($help -notlike "*codeg-mcp --parent-connection-id*") {
            throw "codeg-mcp --help output unexpected: $help"
          }

      - name: Start isolated packaged Windows server
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -B scripts/smoke-server-package.py "dist/${{ matrix.artifact }}" "$($env:RELEASE_TAG.TrimStart('v'))" --require-runtime --require-pi-runtime --log-dir package-smoke
          if ($LASTEXITCODE -ne 0) { throw 'Packaged Server startup failed' }

      - name: Upload artifact for Docker build (Linux only)
        if: startsWith(matrix.target, 'x86_64-unknown-linux') || startsWith(matrix.target, 'aarch64-unknown-linux')
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}
          retention-days: 1

      # Sign the server bundle with the SAME minisign key the desktop
      # updater uses (`tauri signer sign` writes `<file>.sig`). The server's
      # `update::verify` module verifies this signature against the embedded
      # public key before installing — see src-tauri/src/update/verify.rs.
      # `--app-version` binds it to this release's version (the tag, which
      # the draft-release job matched against tauri.conf.json): the server
      # refuses an archive signed for any other version than latest.json
      # announces, or for none.
      - name: Sign and checksum bundle (Unix)
        if: runner.os != 'Windows' && github.event.repository.fork == false
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          pnpm tauri signer sign --app-version "${GITHUB_REF_NAME#v}" "dist/${{ matrix.artifact }}.tar.gz"
          test -f "dist/${{ matrix.artifact }}.tar.gz.sig"

      - name: Checksum bundle (Unix)
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          ( cd dist && shasum -a 256 "${{ matrix.artifact }}.tar.gz" > "${{ matrix.artifact }}.tar.gz.sha256" )

      - name: Sign bundle (Windows)
        if: runner.os == 'Windows' && github.event.repository.fork == false
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          pnpm tauri signer sign --app-version $version "dist/${{ matrix.artifact }}.zip"
          if (-not (Test-Path "dist/${{ matrix.artifact }}.zip.sig")) {
            throw "signature not produced for ${{ matrix.artifact }}.zip"
          }

      - name: Checksum bundle (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $hash = (Get-FileHash -Algorithm SHA256 "dist/${{ matrix.artifact }}.zip").Hash.ToLower()
          "$hash  ${{ matrix.artifact }}.zip`n" | Out-File -Encoding ascii -NoNewline "dist/${{ matrix.artifact }}.zip.sha256"

      # Keep release files as immutable workflow artifacts while desktop
      # matrix jobs are still mutating the draft release. A single collector
      # uploads the complete server set after every desktop job has finished.
      - name: Stage signed upstream release assets
        if: github.event.repository.fork == false
        uses: actions/upload-artifact@v4
        with:
          name: release-server-${{ matrix.artifact }}
          path: |
            dist/${{ matrix.archive }}
            dist/${{ matrix.archive }}.sig
            dist/${{ matrix.archive }}.sha256
          retention-days: 7
          if-no-files-found: error

      - name: Stage unsigned fork release assets
        if: github.event.repository.fork == true
        uses: actions/upload-artifact@v4
        with:
          name: release-server-${{ matrix.artifact }}
          path: |
            dist/${{ matrix.archive }}
            dist/${{ matrix.archive }}.sha256
          retention-days: 7
          if-no-files-found: error

  upload-server-assets:
    needs:
      - create-draft-release
      - build-tauri
      - build-server
    if: >-
      always() &&
      needs.create-draft-release.result == 'success' &&
      needs.build-server.result == 'success' &&
      (github.event_name == 'workflow_dispatch' ||
       needs.build-tauri.result == 'success' ||
       (github.ref_name == 'v0.30.7-fix1' && needs.build-tauri.result == 'skipped'))
    name: Upload complete server asset set
    runs-on: ubuntu-22.04
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download server release assets
        uses: actions/download-artifact@v4
        with:
          pattern: release-server-*
          path: server-release-assets
          merge-multiple: true

      - name: Validate complete server asset set
        shell: bash
        run: |
          set -euo pipefail

          archives=(
            codeg-server-windows-x64.zip
          )

          for archive in "${archives[@]}"; do
            test -s "server-release-assets/$archive"
            test -s "server-release-assets/$archive.sha256"
            if [ "${{ github.event.repository.fork }}" = "false" ]; then
              test -s "server-release-assets/$archive.sig"
            fi
          done

          expected_count=2
          if [ "${{ github.event.repository.fork }}" = "false" ]; then
            expected_count=3
          fi
          actual_count="$(find server-release-assets -maxdepth 1 -type f | wc -l)"
          if [ "$actual_count" -ne "$expected_count" ]; then
            echo "Expected $expected_count server release files, found $actual_count"
            find server-release-assets -maxdepth 1 -type f -printf '%f\n' | sort
            exit 1
          fi

          # PowerShell-produced checksum files from older workflow runs may
          # use CRLF. Normalize before feeding them to GNU sha256sum so the
          # trailing CR is not interpreted as part of the archive filename.
          sed -i 's/\r$//' server-release-assets/*.sha256

          (
            cd server-release-assets
            for checksum in *.sha256; do
              sha256sum --check "$checksum"
            done
          )

      - name: Upload complete server asset set to release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release upload "$RELEASE_TAG"
          server-release-assets/*
          --clobber
          --repo "$GITHUB_REPOSITORY"

      - name: Verify server assets persisted on release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          remote_assets="$(
            gh release view "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --json assets \
              --jq '.assets[].name'
          )"
          archives=(
            codeg-server-windows-x64.zip
          )

          for archive in "${archives[@]}"; do
            grep -Fqx "$archive" <<< "$remote_assets"
            grep -Fqx "$archive.sha256" <<< "$remote_assets"
            if [ "${{ github.event.repository.fork }}" = "false" ]; then
              grep -Fqx "$archive.sig" <<< "$remote_assets"
            fi
          done

  verify-draft-assets:
    needs: [create-draft-release, build-tauri, upload-server-assets]
    if: >-
      always() && github.event_name == 'push' &&
      github.event.repository.fork == true && github.ref_name != 'v0.30.7-fix1' &&
      needs.create-draft-release.result == 'success' &&
      needs.build-tauri.result == 'success' && needs.upload-server-assets.result == 'success'
    name: Verify downloaded Windows assets before publishing
    runs-on: windows-2022
    permissions:
      actions: read
      # GitHub only exposes draft releases to tokens with push access.
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pnpm install --frozen-lockfile
      - name: Verify isolated Office converter integrity guards
        run: node --test scripts/test-office-test-runtime.mjs
      - uses: actions/download-artifact@v4
        with:
          name: release-windows-setup-evidence
          path: setup-evidence
      - name: Download, verify, install, and start packages
        timeout-minutes: 35
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./scripts/verify-windows-release.ps1 -ReleaseTag $env:RELEASE_TAG -Repository $env:GITHUB_REPOSITORY -Destination "$env:RUNNER_TEMP/draft-verification" -SetupManifest setup-evidence/payload.json
      - name: Retain package diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-draft-verification
          path: |
            ${{ runner.temp }}/draft-verification/**/verification.json
            ${{ runner.temp }}/draft-verification/**/verification-progress.json
            ${{ runner.temp }}/draft-verification/**/*.log
            ${{ runner.temp }}/draft-verification/**/*.png
            ${{ runner.temp }}/draft-verification/**/scroll-results.json
            ${{ runner.temp }}/draft-verification/**/*business-failure.json
            ${{ runner.temp }}/draft-verification/**/*-failure.json
            ${{ runner.temp }}/draft-verification/**/*-pi-multi-provider.json
            ${{ runner.temp }}/draft-verification/**/resources-and-migrations.json
            ${{ runner.temp }}/draft-verification/**/*dependencies.json
          if-no-files-found: warn
          retention-days: 14

  publish-release:
    needs:
      - create-draft-release
      - build-tauri
      - build-server
      - upload-server-assets
      - verify-draft-assets
    if: >-
      always() &&
      github.event_name == 'push' &&
      needs.create-draft-release.result == 'success' &&
      (needs.build-tauri.result == 'success' ||
       (github.ref_name == 'v0.30.7-fix1' && needs.build-tauri.result == 'skipped')) &&
      needs.build-server.result == 'success' &&
      needs.upload-server-assets.result == 'success' &&
      (needs.verify-draft-assets.result == 'success' ||
       github.ref_name == 'v0.30.7-fix1' || github.event.repository.fork == false)
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Validate Windows-only fork release assets
        if: github.event.repository.fork == true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          mapfile -t remote_assets < <(
            gh release view "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --json assets \
              --jq '.assets[].name'
          )

          printf '%s\n' "${remote_assets[@]}"
          printf '%s\n' "${remote_assets[@]}" \
            | grep -Fqx 'codeg-server-windows-x64.zip'
          printf '%s\n' "${remote_assets[@]}" \
            | grep -Fqx 'codeg-server-windows-x64.zip.sha256'

          setup_count=0
          setup_checksum_count=0
          for asset in "${remote_assets[@]}"; do
            case "$asset" in
              codeg_*_x64-setup.exe)
                setup_count=$((setup_count + 1))
                ;;
              codeg_*_x64-setup.exe.sha256)
                setup_checksum_count=$((setup_checksum_count + 1))
                ;;
              codeg-server-windows-x64.zip|codeg-server-windows-x64.zip.sha256)
                ;;
              *)
                echo "Unexpected release asset: $asset"
                exit 1
                ;;
            esac
          done

          expected_setup=1
          expected_count=4
          if [ "$RELEASE_TAG" = "v0.30.7-fix1" ]; then
            expected_setup=0
            expected_count=2
          fi
          if [ "$setup_count" -ne "$expected_setup" ] || \
             [ "$setup_checksum_count" -ne "$expected_setup" ] || \
             [ "${#remote_assets[@]}" -ne "$expected_count" ]; then
            echo "Expected $expected_setup setup and two Windows Server files"
            exit 1
          fi

      - name: Publish draft release
        uses: actions/github-script@v7
        env:
          RELEASE_ID: ${{ needs.create-draft-release.outputs.release_id }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const releaseId = Number(process.env.RELEASE_ID);
            const prerelease =
              "${{ needs.create-draft-release.outputs.prerelease }}" === "true";

            await github.rest.repos.updateRelease({
              owner,
              repo,
              release_id: releaseId,
              draft: false,
              prerelease,
            });

            core.info(`Published release #${releaseId}`);

  verify-server-only-release:
    needs: publish-release
    if: >-
      always() &&
      github.event_name == 'push' &&
      github.ref_name == 'v0.30.7-fix1' &&
      needs.publish-release.result == 'success'
    name: Re-download and verify Windows Server release
    runs-on: windows-2022
    permissions:
      contents: read
    steps:
      - name: Verify published release and exact asset set
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $release = gh release view $env:RELEASE_TAG `
            --repo $env:GITHUB_REPOSITORY `
            --json tagName,isDraft,isPrerelease,assets | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw "Could not read published release" }
          if ($release.tagName -ne $env:RELEASE_TAG -or $release.isDraft) {
            throw "Release is missing, still a draft, or has the wrong tag"
          }
          $assetNames = @($release.assets | ForEach-Object { $_.name } | Sort-Object)
          $expectedNames = @(
            "codeg-server-windows-x64.zip",
            "codeg-server-windows-x64.zip.sha256"
          ) | Sort-Object
          if (Compare-Object $assetNames $expectedNames) {
            throw "Published asset set differs from the two expected Server files"
          }

      - name: Re-download, checksum, extract, and execute
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force downloaded, expanded | Out-Null
          gh release download $env:RELEASE_TAG `
            --repo $env:GITHUB_REPOSITORY `
            --pattern "codeg-server-windows-x64.zip" `
            --pattern "codeg-server-windows-x64.zip.sha256" `
            --dir downloaded
          if ($LASTEXITCODE -ne 0) { throw "Release asset download failed" }

          $archive = "downloaded/codeg-server-windows-x64.zip"
          $checksum = "downloaded/codeg-server-windows-x64.zip.sha256"
          $expectedHash = ((Get-Content $checksum -Raw).Trim() -split '\s+')[0].ToLower()
          $actualHash = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLower()
          if ($actualHash -ne $expectedHash) {
            throw "Downloaded archive SHA-256 does not match its checksum asset"
          }

          Expand-Archive -Path $archive -DestinationPath expanded
          $root = "expanded/codeg-server-windows-x64"
          $server = Join-Path $root "codeg-server.exe"
          $companion = Join-Path $root "codeg-mcp.exe"
          $index = Join-Path $root "web/index.html"
          foreach ($required in @($server, $companion, $index)) {
            if (-not (Test-Path $required -PathType Leaf)) {
              throw "Required packaged file is missing: $required"
            }
          }

          $expectedVersion = $env:RELEASE_TAG.TrimStart('v')
          $actualVersion = (& $server --version | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $actualVersion -ne $expectedVersion) {
            throw "Packaged server version '$actualVersion' does not equal '$expectedVersion'"
          }
          $help = (& $companion --help | Out-String)
          if ($LASTEXITCODE -ne 0 -or $help -notlike "*codeg-mcp --parent-connection-id*") {
            throw "Packaged codeg-mcp executable did not return the expected help text"
          }

  verify-published-assets:
    needs: publish-release
    if: >-
      always() && github.event_name == 'push' &&
      github.event.repository.fork == true && github.ref_name != 'v0.30.7-fix1' &&
      needs.publish-release.result == 'success'
    name: Verify published Windows release
    runs-on: windows-2022
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pnpm install --frozen-lockfile
      - name: Verify isolated Office converter integrity guards
        run: node --test scripts/test-office-test-runtime.mjs
      - uses: actions/download-artifact@v4
        with:
          name: release-windows-setup-evidence
          path: setup-evidence
      - name: Verify official assets after publication
        timeout-minutes: 35
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./scripts/verify-windows-release.ps1 -ReleaseTag $env:RELEASE_TAG -Repository $env:GITHUB_REPOSITORY -Destination "$env:RUNNER_TEMP/published-verification" -SetupManifest setup-evidence/payload.json -RequirePublished
      - name: Retain published verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-published-verification
          path: |
            ${{ runner.temp }}/published-verification/**/verification.json
            ${{ runner.temp }}/published-verification/**/verification-progress.json
            ${{ runner.temp }}/published-verification/**/*.log
            ${{ runner.temp }}/published-verification/**/*.png
            ${{ runner.temp }}/published-verification/**/scroll-results.json
            ${{ runner.temp }}/published-verification/**/*business-failure.json
            ${{ runner.temp }}/published-verification/**/*-failure.json
            ${{ runner.temp }}/published-verification/**/*-pi-multi-provider.json
            ${{ runner.temp }}/published-verification/**/resources-and-migrations.json
            ${{ runner.temp }}/published-verification/**/*dependencies.json
          if-no-files-found: warn
          retention-days: 14
