name: Windows native runtime reuse diagnosis
on:
  push:
    branches: ["diagnostics/windows-native-reuse-fix3"]
permissions:
  contents: read
  actions: read
jobs:
  diagnose:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 4e452bb15e0c94cb966aed2ad5339798c7112c4f
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unchanged reuse selector with normal job permissions
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONUTF8: "1"
        run: |
          New-Item -ItemType Directory -Force evidence | Out-Null
          python -u -B scripts/reuse-tested-codex-build.py --output-dir "$env:RUNNER_TEMP/native-proof" 2>&1 | Tee-Object evidence/reuse.log
          if ($LASTEXITCODE -ne 0) { throw 'Reuse diagnostic exited unexpectedly' }
          if (-not (Test-Path "$env:RUNNER_TEMP/native-proof/build-reuse.json")) { throw 'Selector rejected the unchanged original build; inspect reuse.log' }
          Copy-Item "$env:RUNNER_TEMP/native-proof/build-reuse.json" evidence/
      - name: Preserve narrow read-only evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-native-reuse-diagnosis
          path: evidence/
          if-no-files-found: warn
